<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>КПК «ИСТОК-М» • ПГТ Нижний Исток</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- Подключение Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --pda-shell: #16181b;
      --pda-screen-bg: #090c0a;
      --pda-amber: #d4a373;
      --pda-green: #38b000;
      --card-bg: #e6e0d2;
      --stamp-color: #2b3a67;
      --leather-color: #22140d;
      --card-depth: 8px;
    }
    * { box-sizing: border-box; }
    body {
      background: #050608;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }

    /* АДАПТИВНЫЙ КОРПУС КПК */
    .pda-device {
      width: 100%;
      max-width: 360px;
      height: 96vh;
      max-height: 650px;
      background: var(--pda-shell);
      border: 4px solid #282d33;
      border-radius: 20px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.95), inset 0 0 15px rgba(0,0,0,0.8);
      position: relative;
      padding: 12px 10px 14px 10px;
      display: flex;
      flex-direction: column;
    }

    .bolt {
      position: absolute;
      width: 7px;
      height: 7px;
      background: #3a4149;
      border-radius: 50%;
      box-shadow: inset 0 1px 2px #000, 0 1px 1px rgba(255,255,255,0.1);
    }
    .bolt-tl { top: 6px; left: 8px; }
    .bolt-tr { top: 6px; right: 8px; }
    .bolt-bl { bottom: 6px; left: 8px; }
    .bolt-br { bottom: 6px; right: 8px; }

    .pda-top-bezel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 6px 6px 6px;
      font-size: 8.5px;
      color: #66727f;
      letter-spacing: 2px;
      font-weight: bold;
    }
    .status-led {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--pda-green);
      box-shadow: 0 0 8px var(--pda-green);
      animation: ledPulse 3s infinite;
    }
    @keyframes ledPulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

    .pda-screen {
      flex: 1;
      background: var(--pda-screen-bg);
      border: 2px solid #1f2722;
      border-radius: 10px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: inset 0 0 25px rgba(0,0,0,0.9);
    }
    .pda-screen::after {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 2px);
      pointer-events: none;
      z-index: 90;
    }

    .pda-hud {
      background: rgba(16, 26, 20, 0.95);
      border-bottom: 1px solid #233829;
      padding: 5px 8px;
      font-size: 9.5px;
      color: #6b9376;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 80;
    }
    .pda-hud-time { color: var(--pda-amber); font-weight: bold; }

    .pda-view {
      flex: 1;
      display: none;
      flex-direction: column;
      padding: 8px;
      overflow-y: auto;
      position: relative;
      z-index: 50;
    }
    .pda-view.active { display: flex; }

    .menu-header {
      font-size: 10.5px;
      color: #4ade80;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
      border-bottom: 1px solid #1a3322;
      padding-bottom: 4px;
    }
    .grid-menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }
    .pda-app-btn {
      background: #0f1612;
      border: 1px solid #233b2a;
      border-radius: 8px;
      padding: 10px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.7);
      transition: all 0.15s;
    }
    .pda-app-btn:active {
      background: #1b2e20;
      border-color: #4ade80;
      transform: scale(0.97);
    }
    .pda-app-btn.admin-btn {
      border-color: #b5179e;
      background: #1f0d1b;
      grid-column: span 2;
    }
    .pda-app-btn.admin-btn:active {
      background: #33132d;
      border-color: #f72585;
    }
    .pda-app-icon { font-size: 19px; }
    .pda-app-title {
      font-size: 9px;
      font-weight: bold;
      color: #9cb8a3;
      letter-spacing: 1px;
      text-align: center;
    }
    .admin-btn .pda-app-title { color: #f72585; }

    .btn-back-pda {
      align-self: flex-start;
      background: #101c13;
      color: #72a37d;
      border: 1px solid #233e29;
      padding: 5px 10px;
      font-size: 9px;
      font-family: inherit;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 6px;
      font-weight: bold;
    }
    .btn-back-pda:active { background: #1b3320; color: #4ade80; }

    /* ==================== ПАСПОРТ ==================== */
    .passport-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
      flex: 1;
      touch-action: none;
    }
    .scene { width: 270px; height: 405px; position: relative; }
    .card-wrap {
      width: 100%; height: 100%; position: absolute;
      transform-style: preserve-3d; border-radius: 12px; cursor: grab;
    }
    .card-wrap:active { cursor: grabbing; }
    .card-face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 12px; overflow: hidden; }
    .card-front {
      background: var(--card-bg); border: 2px solid #5a544b; padding: 13px;
      background-image: radial-gradient(#d3cbba 15%, transparent 16%); background-size: 14px 14px;
      transform: translateZ(calc(var(--card-depth) / 2));
    }
    .card-back {
      background: var(--leather-color); border: 2px solid #140d0a;
      transform: rotateY(180deg) translateZ(calc(var(--card-depth) / 2));
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      box-shadow: inset 0 0 60px rgba(0,0,0,0.85);
      background-image: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.03) 0%, transparent 80%),
        repeating-linear-gradient(45deg, rgba(0,0,0,0.06) 0px, rgba(0,0,0,0.06) 2px, transparent 2px, transparent 4px);
    }
    .card-edge-left, .card-edge-right { position: absolute; top: 0; width: var(--card-depth); height: 100%; background: #170e0a; }
    .card-edge-left { left: calc(var(--card-depth) / -2); transform: rotateY(-90deg); }
    .card-edge-right { right: calc(var(--card-depth) / -2); transform: rotateY(90deg); }
    .card-edge-top, .card-edge-bottom { position: absolute; left: 0; width: 100%; height: var(--card-depth); background: #1a100c; }
    .card-edge-top { top: calc(var(--card-depth) / -2); transform: rotateX(90deg); }
    .card-edge-bottom { bottom: calc(var(--card-depth) / -2); transform: rotateX(-90deg); }

    .glare {
      position: absolute; inset: 0;
      background: linear-gradient(115deg, transparent 20%, rgba(255,255,255,0.2) 45%, rgba(255,255,255,0.45) 50%, rgba(255,255,255,0.2) 55%, transparent 80%);
      pointer-events: none; z-index: 10; mix-blend-mode: overlay; opacity: 0.7;
    }
    .hologram-strip {
      position: absolute; top: 0; right: 10px; width: 10px; height: 100%;
      background: linear-gradient(180deg, #ff0080, #7928ca, #0070f3, #00dfd8, #7928ca, #ff0080);
      background-size: 100% 300%; opacity: 0.45; mix-blend-mode: overlay;
      animation: holoShift 5s ease infinite; pointer-events: none; z-index: 5;
    }
    @keyframes holoShift { 0% { background-position: 0% 0%; } 50% { background-position: 0% 100%; } 100% { background-position: 0% 0%; } }

    .header { text-align: center; font-size: 9px; font-weight: bold; border-bottom: 2px solid #333; padding-bottom: 5px; letter-spacing: 1px; cursor: pointer; }
    .photo-area {
      position: relative; width: 85px; height: 105px; border: 1px dashed #444; background: #c2beb4;
      display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; margin-top: 10px;
    }
    .photo-area img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%) contrast(130%) brightness(90%); }
    .photo-placeholder { font-size: 8.5px; color: #555; text-align: center; }
    .fields { font-size: 10px; line-height: 1.5; }
    .editable-field { border-bottom: 1px dashed #777; cursor: pointer; padding: 1px 3px; }
    .editable-field:hover { background: rgba(0,0,0,0.06); }

    .seal-button {
      position: absolute; bottom: 12px; right: 12px; width: 72px; height: 72px; border-radius: 50%;
      border: 2px solid var(--stamp-color); display: flex; align-items: center; justify-content: center;
      text-align: center; font-size: 7px; color: var(--stamp-color); cursor: pointer; transform: rotate(-14deg);
      background: transparent; z-index: 6; opacity: 0.88;
    }
    .seal-inner-ring {
      position: absolute; inset: 3px; border: 1px solid var(--stamp-color); border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.25; pointer-events: none;
    }
    .leather-stitch { position: absolute; inset: 8px; border: 1px dashed rgba(184, 134, 11, 0.35); border-radius: 8px; pointer-events: none; }
    .leather-title {
      position: absolute; top: 38px; color: rgba(184, 134, 11, 0.55); font-size: 14px; font-weight: bold;
      letter-spacing: 5px; text-shadow: 0 1px 1px rgba(255,255,255,0.1), 0 -1px 2px rgba(0,0,0,0.9); pointer-events: none;
    }
    .leather-crest-box {
      width: 115px; height: 115px; border: 2px solid rgba(184, 134, 11, 0.25); border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.7), 0 1px 1px rgba(255,255,255,0.05);
      color: rgba(184, 134, 11, 0.3); font-size: 8.5px; letter-spacing: 2px; text-align: center; margin-top: 25px;
    }

    .uv-active { filter: drop-shadow(0 0 20px rgba(138, 43, 226, 0.6)) !important; }
    .uv-active .card-front { background: #110d1a !important; color: #9d8ec2 !important; background-image: none !important; border-color: #633299 !important; }
    .uv-active .card-edge-top, .uv-active .card-edge-bottom, .uv-active .card-edge-left, .uv-active .card-edge-right {
      background: #1c0d29 !important; box-shadow: inset 0 0 5px #8a2be2 !important;
    }
    .uv-glow { display: none; position: absolute; color: #00ffcc; font-weight: bold; text-shadow: 0 0 8px #00ffcc; pointer-events: none; opacity: 0.9; }
    .uv-active .uv-glow { display: block; }
    .uv-diagonal-stamp {
      top: 175px; left: 10px; width: 240px; text-align: center; border: 2px solid rgba(0, 255, 204, 0.4);
      padding: 5px; font-size: 9px; letter-spacing: 1.2px; transform: rotate(-18deg); border-radius: 4px; background: rgba(0, 255, 204, 0.05);
    }
    .uv-bottom-code { bottom: 18px; left: 14px; font-size: 8px; letter-spacing: 1px; }

    .passport-controls { display: flex; gap: 8px; margin-top: 8px; }
    .btn-act {
      background: #152219; color: #8cb896; border: 1px solid #284430; padding: 5px 12px;
      font-family: inherit; font-size: 10px; border-radius: 4px; cursor: pointer;
    }
    .btn-act:active { background: #1f3825; color: #4ade80; }

    /* ==================== РАДИО ==================== */
    .radio-unit {
      background: #14110f; border: 2px solid #2d2420; border-radius: 12px;
      padding: 10px; margin-top: 4px; box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
    }
    .radio-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #3a302a; padding-bottom: 6px; margin-bottom: 8px; }
    .radio-brand { color: #9e8a78; font-size: 10.5px; font-weight: bold; letter-spacing: 2px; }
    .magic-eye { width: 15px; height: 15px; border-radius: 50%; background: #111; border: 1px solid #333; transition: all 0.2s; }
    .magic-eye.active { background: #00ff66; box-shadow: 0 0 10px #00ff66; }

    .radio-dial-glass {
      width: 100%; height: 70px; background: #0e0d0b; border: 1px solid #3d322a;
      border-radius: 6px; position: relative; overflow: hidden; cursor: pointer;
    }
    .radio-dial-glass.powered { background: radial-gradient(circle at 50% 50%, #302416 0%, #0e0d0b 80%); }
    .dial-markings { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 5px 8px; color: #55483c; font-size: 8px; font-weight: bold; }
    .radio-dial-glass.powered .dial-markings { color: #d4a373; }
    .dial-stations-row { display: flex; justify-content: space-between; border-bottom: 1px solid #4a3d32; padding-bottom: 2px; }
    .dial-needle { position: absolute; top: 0; bottom: 0; width: 2px; background: #e63946; box-shadow: 0 0 6px #e63946; left: 10%; pointer-events: none; }

    .current-freq-display { text-align: center; margin: 6px 0; font-size: 10.5px; color: #d4a373; font-weight: bold; }
    .speaker-grill {
      height: 65px; background: repeating-linear-gradient(0deg, #120e0c 0px, #120e0c 3px, #221b17 3px, #221b17 6px);
      border-radius: 6px; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; color: #3d3129; font-size: 8.5px;
    }
    .radio-controls { display: flex; justify-content: space-around; align-items: center; }
    .switch-btn { width: 38px; height: 38px; border-radius: 50%; background: #2b221d; border: 2px solid #4a3b32; color: #d4a373; cursor: pointer; font-size: 8.5px; font-weight: bold; }
    .switch-btn.on { background: #1c2e1f; border-color: #386641; color: #70e000; box-shadow: 0 0 10px rgba(112,224,0,0.3); }
    .knob { width: 55px; height: 55px; border-radius: 50%; background: radial-gradient(circle at 40% 40%, #3a2e26 0%, #161210 80%); border: 2px solid #4a3c33; position: relative; cursor: ew-resize; }
    .knob-marker { position: absolute; top: 4px; left: calc(50% - 2px); width: 4px; height: 11px; background: #d4a373; }

    .stub-terminal {
      flex: 1; border: 1px dashed #233b2a; border-radius: 8px; padding: 12px;
      display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
      color: #62876b; font-size: 10.5px; line-height: 1.5;
    }

    /* ==================== ПУЛЬТ КОМЕНДАНТА ==================== */
    .admin-panel {
      flex: 1; display: flex; flex-direction: column; gap: 8px; color: #e0aaff; font-size: 10px;
    }
    .admin-card {
      background: #190918; border: 1px solid #7209b7; border-radius: 8px; padding: 10px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    }
    .admin-card h4 { margin: 0 0 6px 0; color: #f72585; font-size: 10.5px; letter-spacing: 1px; }
    .admin-btn-action {
      background: #480ca8; color: #fff; border: 1px solid #7209b7; padding: 7px;
      font-family: inherit; font-size: 9.5px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 4px;
    }
    .admin-btn-action:active { background: #560bad; }
    .token-box {
      background: #0d040c; border: 1px dashed #f72585; color: #4cc9f0; padding: 6px;
      text-align: center; font-weight: bold; font-size: 12px; letter-spacing: 2px; margin-top: 5px;
    }
    .registry-box {
      max-height: 140px; overflow-y: auto; background: #0c040b; border: 1px solid #33122e;
      padding: 6px; font-size: 9px; line-height: 1.4; border-radius: 4px; margin-top: 5px;
    }
    .registry-item {
      border-bottom: 1px dashed #44173e; padding-bottom: 4px; margin-bottom: 4px;
    }

    /* МОДАЛКА */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none;
      align-items: center; justify-content: center; z-index: 100; padding: 16px;
    }
    .modal-box { background: #e6e0d2; border: 2px solid #333; padding: 16px; width: 100%; max-width: 280px; border-radius: 8px; font-size: 11px; color: #222; }
    .modal-box input, .modal-box select { width: 100%; padding: 8px; margin: 8px 0 10px 0; font-family: inherit; border: 1px solid #444; background: #f7f5ef; font-size: 11px; }
    .modal-box button { width: 100%; padding: 8px; background: #2b3a67; color: #fff; border: none; cursor: pointer; font-family: inherit; font-weight: bold; }
    .unlock-link { font-size: 9px; color: #2b3a67; text-decoration: underline; cursor: pointer; display: inline-block; margin-top: 8px; }

    .bureau-overlay {
      position: absolute; inset: 0; background: rgba(8, 8, 12, 0.96); color: #ff3838; padding: 16px;
      border-radius: 12px; display: none; flex-direction: column; justify-content: center; font-size: 9.5px; z-index: 30;
      animation: glitch 0.2s infinite;
    }
    @keyframes glitch { 0% { transform: translate(0) } 20% { transform: translate(-2px, 1px) } 40% { transform: translate(1px, -2px) } 60% { transform: translate(-1px, 2px) } 80% { transform: translate(2px, -1px) } 100% { transform: translate(0) } }
  </style>
</head>
<body>

<audio id="radioVoice" src="./welcome.mp3" loop preload="auto"></audio>

<div class="pda-device">
  <div class="bolt bolt-tl"></div>
  <div class="bolt bolt-tr"></div>
  <div class="bolt bolt-bl"></div>
  <div class="bolt bolt-br"></div>

  <div class="pda-top-bezel">
    <span>КПК «ИСТОК-М»</span>
    <div style="display: flex; align-items: center; gap: 6px;">
      <span>СВЯЗЬ</span>
      <div class="status-led"></div>
    </div>
  </div>

  <div class="pda-screen">
    
    <div class="pda-hud">
      <span id="hudCallsign">ЖИТЕЛЬ • ИСТ-79</span>
      <span class="pda-hud-time" id="hudClock">--:-- [ИСТОК]</span>
      <span>МАЧТА-4: 86%</span>
    </div>

    <!-- МЕНЮ КПК -->
    <div class="pda-view active" id="viewMenu">
      <div class="menu-header">СИСТЕМА ВЫЧИСЛЕНИЙ • ГЛАВНЫЙ УЗЕЛ</div>
      <div class="grid-menu">
        
        <div class="pda-app-btn" id="openPassportApp">
          <div class="pda-app-icon">🪪</div>
          <div class="pda-app-title">УДОСТОВЕРЕНИЕ</div>
        </div>

        <div class="pda-app-btn" id="openRadioApp">
          <div class="pda-app-icon">📻</div>
          <div class="pda-app-title">РАДИОСКАНЕР</div>
        </div>

        <div class="pda-app-btn" onclick="openStub('КАРТА СЕКТОРА', 'Спутниковая развёртка недоступна. Радиомачта №4 подавляет сторонние сигналы. Ориентируйтесь по визуальным ориентирам посёлка.')">
          <div class="pda-app-icon">🗺️</div>
          <div class="pda-app-title">КАРТА СЕКТОРА</div>
        </div>

        <div class="pda-app-btn" onclick="openStub('ДИСПЕТЧЕР ЖЭК', 'Журнал обращений ЖЭК №1. Приём жалоб на перебои электросети и посторонние шумы в коммуникациях.')">
          <div class="pda-app-icon">🏢</div>
          <div class="pda-app-title">ДИСПЕТЧЕР ЖЭК</div>
        </div>

        <div class="pda-app-btn" onclick="openStub('СНАРЯЖЕНИЕ', 'Личные карманы гражданина. Талоны на керосин, ключи от подвалов и памятки учёта.')">
          <div class="pda-app-icon">🎒</div>
          <div class="pda-app-title">СНАРЯЖЕНИЕ</div>
        </div>

        <div class="pda-app-btn" onclick="openStub('ДЕПЕШИ ГО/ЧС', 'Архив сводок комендатуры. Пломба №4 удерживает контур. Покидать жилой сектор после 23:00 запрещено.')">
          <div class="pda-app-icon">📟</div>
          <div class="pda-app-title">ДЕПЕШИ ГО/ЧС</div>
        </div>

        <!-- ПУЛЬТ КОМЕНДАНТА -->
        <div class="pda-app-btn admin-btn" id="adminAppBtn" style="display: none;">
          <div class="pda-app-icon">⚡</div>
          <div class="pda-app-title">ПУЛЬТ КОМЕНДАНТА [ДОПУСК-1]</div>
        </div>

      </div>
    </div>

    <!-- УДОСТОВЕРЕНИЕ -->
    <div class="pda-view" id="viewPassport">
      <button class="btn-back-pda" id="backFromPassport">◄ МЕНЮ КПК</button>
