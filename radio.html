<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Приёмник «Ирень-401» • ПГТ Нижний Исток</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0b0d10;
      --unit-bg: #1a1512;
      --dial-bg: #0d0c0a;
      --amber-light: #e69d45;
      --green-eye: #00ff66;
    }
    * { box-sizing: border-box; }
    body {
      background: radial-gradient(circle at 50% 45%, #202731 0%, #0b0d10 80%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      color: #cfd3dc;
    }

    /* Навигация возврата к документам */
    .top-bar {
      position: fixed;
      top: 14px;
      display: flex;
      justify-content: space-between;
      width: 320px;
      z-index: 20;
    }
    .nav-btn {
      background: rgba(22, 26, 33, 0.85);
      border: 1px solid #3d4654;
      color: #9da7b7;
      text-decoration: none;
      font-size: 11px;
      padding: 6px 14px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .nav-btn:active { background: #2a3342; }

    /* Корпус радиоприёмника */
    .radio-unit {
      width: 320px;
      background: var(--unit-bg);
      border: 3px solid #332822;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 
        0 25px 50px rgba(0,0,0,0.9),
        inset 0 0 35px rgba(0,0,0,0.85),
        0 0 1px rgba(255,255,255,0.08);
      position: relative;
      background-image: 
        radial-gradient(circle at 30% 20%, rgba(255,255,255,0.03) 0%, transparent 60%),
        repeating-linear-gradient(45deg, rgba(0,0,0,0.04) 0px, rgba(0,0,0,0.04) 2px, transparent 2px, transparent 4px);
    }

    /* Верхняя панель приёмника */
    .radio-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #3d2f27;
      padding-bottom: 10px;
      margin-bottom: 14px;
    }
    .radio-brand {
      color: #a89482;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 3px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.9);
    }
    .magic-eye-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 9px;
      color: #77685c;
    }
    .magic-eye {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #111;
      border: 2px solid #3d322a;
      box-shadow: inset 0 0 6px #000;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .magic-eye.active {
      background: var(--green-eye);
      box-shadow: 0 0 14px var(--green-eye), inset 0 0 4px #fff;
    }

    /* Аналоговая шкала верньера */
    .radio-dial-glass {
      width: 100%;
      height: 90px;
      background: var(--dial-bg);
      border: 2px solid #42342b;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 25px rgba(0,0,0,0.98);
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .radio-dial-glass.powered {
      background: radial-gradient(circle at 50% 50%, #3a2818 0%, #0d0c0a 85%);
      box-shadow: inset 0 0 25px rgba(230, 157, 69, 0.25), 0 0 8px rgba(230, 157, 69, 0.15);
    }
    .dial-markings {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 8px 12px;
      color: #5a4b3e;
      font-size: 9px;
      font-weight: bold;
      pointer-events: none;
    }
    .radio-dial-glass.powered .dial-markings {
      color: var(--amber-light);
      text-shadow: 0 0 4px rgba(230, 157, 69, 0.45);
    }
    .dial-stations-row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(100, 78, 62, 0.5);
      padding-bottom: 4px;
    }
    .dial-needle {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #e63946;
      box-shadow: 0 0 6px #e63946;
      left: 0%;
      pointer-events: none;
      transition: left 0.05s linear;
    }

    /* Табло текущей частоты */
    .current-freq-display {
      text-align: center;
      margin: 12px 0 6px 0;
      font-size: 13px;
      color: #9e8b7b;
      letter-spacing: 2px;
      font-weight: bold;
      min-height: 20px;
    }
    .radio-dial-glass.powered ~ .current-freq-display {
      color: var(--amber-light);
      text-shadow: 0 0 5px rgba(230, 157, 69, 0.3);
    }

    /* Решётка громкоговорителя */
    .speaker-grill {
      height: 95px;
      background: repeating-linear-gradient(0deg, #100c0a 0px, #100c0a 3px, #241c17 3px, #241c17 6px);
      border-radius: 8px;
      margin: 12px 0;
      border: 1px solid #33261f;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #42342b;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-shadow: 0 1px 1px rgba(0,0,0,0.8);
      position: relative;
    }
    .speaker-grill::after {
      content: "••• СЕТЬ ВЕЩАНИЯ ПГТ •••";
    }

    /* Органы управления */
    .radio-controls {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-top: 14px;
    }
    .ctrl-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: 9px;
      color: #8c7a6c;
      font-weight: bold;
    }

    /* Тумблер ВКЛ / ВЫКЛ */
    .switch-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #2a201a;
      border: 2px solid #4a382e;
      color: #a89482;
      cursor: pointer;
      font-weight: bold;
      font-size: 10px;
      font-family: inherit;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
      transition: all 0.15s;
    }
    .switch-btn:active { transform: translateY(1px); }
    .switch-btn.on {
      background: #1b2e1e;
      border-color: #3b6b44;
      color: #70e000;
      box-shadow: 0 0 12px rgba(112, 224, 0, 0.35);
    }

    /* Верньер частоты */
    .knob {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 40%, #3d2f25 0%, #17120e 80%);
      border: 3px solid #4d3a2f;
      box-shadow: 0 6px 15px rgba(0,0,0,0.85);
      position: relative;
      cursor: ew-resize;
    }
    .knob-marker {
      position: absolute;
      top: 6px;
      left: calc(50% - 2px);
      width: 4px;
      height: 14px;
      background: var(--amber-light);
      border-radius: 2px;
      box-shadow: 0 0 4px rgba(230, 157, 69, 0.4);
    }
  </style>
</head>
<body>

<div class="top-bar">
  <a href="index.html" class="nav-btn">🪪 К удостоверению</a>
</div>

<div class="radio-unit">
  <div class="radio-header">
    <div class="radio-brand">ИРЕНЬ • 401</div>
    <div class="magic-eye-wrap">
      <span>ИНДИКАТОР</span>
      <div class="magic-eye" id="magicEye"></div>
    </div>
  </div>

  <div class="radio-dial-glass" id="radioDial">
    <div class="dial-markings">
      <div class="dial-stations-row">
        <span>64</span>
        <span>УКВ-1</span>
        <span>74</span>
        <span>УКВ-2</span>
        <span>88</span>
        <span>FM</span>
        <span>108</span>
      </div>
      <div style="display: flex; justify-content: space-around; opacity: 0.6; font-size: 8px;">
        <span>|  |  |  |</span>
        <span>|  |  |  |</span>
        <span>|  |  |  |</span>
      </div>
    </div>
    <div class="dial-needle" id="dialNeedle"></div>
  </div>

  <div class="current-freq-display" id="freqText">ПИТАНИЕ ОТКЛЮЧЕНО</div>

  <div class="speaker-grill"></div>

  <div class="radio-controls">
    <div class="ctrl-box">
      <button class="switch-btn" id="powerBtn">ВКЛ</button>
      <span>ПИТАНИЕ</span>
    </div>

    <div class="ctrl-box">
      <div class="knob" id="tuningKnob">
        <div class="knob-marker"></div>
      </div>
      <span>ВЕРНЬЕР ЧАСТОТЫ</span>
    </div>
  </div>
</div>

<script>
  if (window.Telegram && window.Telegram.WebApp) {
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
  }

  // ==================== ЗВУКОВОЙ ТРАКТ WEB AUDIO ====================
  let audioCtx = null;
  function getAudioContext() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playSwitchClick() {
    const ctx = getAudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.setValueAtTime(280, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.5, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.09);
  }

  let noiseNode = null;
  let noiseGain = null;
  let heterodyneWhistle = null;
  let heterodyneGain = null;
  let stationOsc1 = null;
  let stationOsc2 = null;
  let stationGain = null;

  function initAudioNodes() {
    const ctx = getAudioContext();

    // 1. Белый шум эфира
    const bufferSize = ctx.sampleRate * 2;
    const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;

    noiseNode = ctx.createBufferSource();
    noiseNode.buffer = noiseBuffer;
    noiseNode.loop = true;

    const noiseFilter = ctx.createBiquadFilter();
    noiseFilter.type = 'bandpass';
    noiseFilter.frequency.value = 1500;
    noiseFilter.Q.value = 1.4;

    noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.0, ctx.currentTime);

    noiseNode.connect(noiseFilter);
    noiseFilter.connect(noiseGain);
    noiseGain.connect(ctx.destination);
    noiseNode.start();

    // 2. Гетеродинный свист при подходе к несущей
    heterodyneWhistle = ctx.createOscillator();
    heterodyneGain = ctx.createGain();
    heterodyneWhistle.frequency.setValueAtTime(1000, ctx.currentTime);
    heterodyneGain.gain.setValueAtTime(0.0, ctx.currentTime);
    heterodyneWhistle.connect(heterodyneGain);
    heterodyneGain.connect(ctx.destination);
    heterodyneWhistle.start();

    // 3. Звуковой тракт радиостанций
    stationOsc1 = ctx.createOscillator();
    stationOsc2 = ctx.createOscillator();
    stationGain = ctx.createGain();
    stationGain.gain.setValueAtTime(0.0, ctx.currentTime);

    stationOsc1.connect(stationGain);
    stationOsc2.connect(stationGain);
    stationGain.connect(ctx.destination);
    stationOsc1.start();
    stationOsc2.start();
  }

  // ==================== ЛОГИКА ЭФИРА ====================
  let isRadioOn = false;
  let currentFreq = 64.0;
  const minFreq = 64.0;
  const maxFreq = 108.0;

  const powerBtn = document.getElementById('powerBtn');
  const radioDial = document.getElementById('radioDial');
  const dialNeedle = document.getElementById('dialNeedle');
  const freqText = document.getElementById('freqText');
  const magicEye = document.getElementById('magicEye');
  const tuningKnob = document.getElementById('tuningKnob');

  const stations = [
    { f: 68.2, name: 'УЗЕЛ СВЯЗИ • ПОЗЫВНЫЕ', tone: 440, type: 'chime' },
    { f: 94.7, name: '«ЦВЕТОК-9» • НОМЕРНАЯ', tone: 880, type: 'numbers' },
    { f: 105.1, name: 'МАЧТА №4 • НЕСУЩАЯ', tone: 54, type: 'hum' }
  ];

  function updateAudio() {
    if (!isRadioOn || !audioCtx) return;
    const ctx = audioCtx;

    let closestDist = 999;
    let activeStation = null;

    stations.forEach(st => {
      const d = Math.abs(currentFreq - st.f);
      if (d < closestDist) {
        closestDist = d;
        activeStation = st;
      }
    });

    if (closestDist < 1.4) {
      const signalPower = Math.max(0, 1 - (closestDist / 1.4));
      magicEye.classList.add('active');
      magicEye.style.opacity = (0.25 + signalPower * 0.75).toFixed(2);

      // Статика затихает при точном попадании в волну
      noiseGain.gain.setTargetAtTime(0.12 * (1 - signalPower * 0.8), ctx.currentTime, 0.05);

      // Свист интерференции на краях частоты
      if (closestDist > 0.08 && closestDist < 0.9) {
        heterodyneWhistle.frequency.setTargetAtTime(closestDist * 3400, ctx.currentTime, 0.05);
        heterodyneGain.gain.setTargetAtTime(0.08 * (1 - closestDist), ctx.currentTime, 0.05);
      } else {
        heterodyneGain.gain.setTargetAtTime(0.0, ctx.currentTime, 0.05);
      }

      // Тональность передатчика
      stationGain.gain.setTargetAtTime(0.24 * signalPower, ctx.currentTime, 0.05);
      if (activeStation.type === 'hum') {
        stationOsc1.type = 'sawtooth';
        stationOsc1.frequency.setTargetAtTime(50, ctx.currentTime, 0.05);
        stationOsc2.type = 'sine';
        stationOsc2.frequency.setTargetAtTime(100, ctx.currentTime, 0.05);
      } else if (activeStation.type === 'numbers') {
        stationOsc1.type = 'square';
        stationOsc1.frequency.setTargetAtTime(750, ctx.currentTime, 0.05);
        stationOsc2.type = 'sine';
        stationOsc2.frequency.setTargetAtTime(375, ctx.currentTime, 0.05);
      } else {
        stationOsc1.type = 'sine';
        stationOsc1.frequency.setTargetAtTime(activeStation.tone, ctx.currentTime, 0.05);
        stationOsc2.type = 'triangle';
        stationOsc2.frequency.setTargetAtTime(activeStation.tone * 1.5, ctx.currentTime, 0.05);
      }

      freqText.innerText = `${currentFreq.toFixed(1)} МГц [${activeStation.name}]`;
    } else {
      magicEye.classList.remove('active');
      magicEye.style.opacity = '0.12';
      noiseGain.gain.setTargetAtTime(0.18, ctx.currentTime, 0.05);
      heterodyneGain.gain.setTargetAtTime(0.0, ctx.currentTime, 0.05);
      stationGain.gain.setTargetAtTime(0.0, ctx.currentTime, 0.05);
      freqText.innerText = `${currentFreq.toFixed(1)} МГц [ШУМ ЭФИРА]`;
    }
  }

  function setFrequency(newFreq) {
    currentFreq = Math.max(minFreq, Math.min(maxFreq, newFreq));
    const percent = ((currentFreq - minFreq) / (maxFreq - minFreq)) * 100;
    dialNeedle.style.left = `${percent}%`;
    updateAudio();
  }

  // Включение питания
  powerBtn.addEventListener('click', () => {
    isRadioOn = !isRadioOn;
    playSwitchClick();

    if (isRadioOn) {
      powerBtn.classList.add('on');
      powerBtn.innerText = 'ВЫКЛ';
      radioDial.classList.add('powered');
      if (!noiseNode) initAudioNodes();
      updateAudio();
    } else {
      powerBtn.classList.remove('on');
      powerBtn.innerText = 'ВКЛ';
      radioDial.classList.remove('powered');
      magicEye.classList.remove('active');
      freqText.innerText = 'ПИТАНИЕ ОТКЛЮЧЕНО';
      if (audioCtx) {
        noiseGain?.gain.setTargetAtTime(0.0, audioCtx.currentTime, 0.05);
        stationGain?.gain.setTargetAtTime(0.0, audioCtx.currentTime, 0.05);
        heterodyneGain?.gain.setTargetAtTime(0.0, audioCtx.currentTime, 0.05);
      }
    }
  });

  // Перетаскивание по шкале верньера
  let isDialDragging = false;
  radioDial.addEventListener('pointerdown', (e) => {
    isDialDragging = true;
    const rect = radioDial.getBoundingClientRect();
    const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    setFrequency(minFreq + ratio * (maxFreq - minFreq));
  });

  window.addEventListener('pointermove', (e) => {
    if (!isDialDragging) return;
    const rect = radioDial.getBoundingClientRect();
    const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    setFrequency(minFreq + ratio * (maxFreq - minFreq));
  });

  window.addEventListener('pointerup', () => { isDialDragging = false; });

  // Вращение колеса настройки
  let knobStartX = 0;
  let isKnobDragging = false;
  let knobRot = 0;

  tuningKnob.addEventListener('pointerdown', (e) => {
    isKnobDragging = true;
    knobStartX = e.clientX;
  });

  window.addEventListener('pointermove', (e) => {
    if (!isKnobDragging) return;
    const dx = e.clientX - knobStartX;
    knobStartX = e.clientX;
    knobRot += dx * 4;
    tuningKnob.style.transform = `rotate(${knobRot}deg)`;
    setFrequency(currentFreq + dx * 0.12);
  });

  window.addEventListener('pointerup', () => { isKnobDragging = false; });
</script>
</body>
</html>
